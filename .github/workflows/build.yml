name: Build Vanilla Kernel for SM-M127F (No KernelSU)

on: [workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev crossbuild-essential-arm64 python3 zip unzip libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu ccache clang lld llvm

    - name: Set up ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-kernel-${{ runner.os }}-

    - name: Configure ccache
      run: |
        ccache --max-size=2G
        ccache --set-config=compression=true
        ccache --zero-stats
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "ccache configured, cache dir: $HOME/.ccache"
        ccache --show-stats

    - name: Download Android Clang 9.0.3 toolchain
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android10-release/clang-r353983c.tar.gz -O clang-9.tar.gz || \
        wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-11.1.0/clang+llvm-11.1.0-aarch64-linux-gnu.tar.xz -O clang-9.tar.gz || true
        wget -q "https://github.com/ZyCromerZ/Clang/releases/download/9.0.3-20210211-release/Clang-9.0.3-20210211.tar.gz" -O clang-android.tar.gz 2>/dev/null || true
        if [ -f clang-android.tar.gz ] && [ -s clang-android.tar.gz ]; then
            mkdir -p clang-9
            tar -xf clang-android.tar.gz -C clang-9 --strip-components=1 2>/dev/null || \
            tar -xf clang-android.tar.gz -C clang-9 2>/dev/null || true
        fi
        if [ -f clang-9/bin/clang ]; then
            echo "CLANG_PATH=$HOME/toolchains/clang-9/bin" >> $GITHUB_ENV
            echo "Android Clang found:"
            clang-9/bin/clang --version
        else
            echo "CLANG_PATH=/usr/bin" >> $GITHUB_ENV
            echo "WARNING: Using system clang-14 as fallback"
            clang --version
        fi

        # Wrappers for as/ld
        sudo cp /usr/bin/as /usr/bin/as.x86_64
        printf '#!/bin/bash\nfor arg in "$@"; do\n  case "$arg" in\n    -EL|-EB)\n      exec /usr/bin/aarch64-linux-gnu-as "$@"\n      ;;\n    --64)\n      exec /usr/bin/as.x86_64 "$@"\n      ;;\n  esac\ndone\nexec /usr/bin/as.x86_64 "$@"\n' | sudo tee /usr/bin/as > /dev/null
        sudo chmod +x /usr/bin/as
        sudo cp /usr/bin/ld /usr/bin/ld.x86_64
        printf '#!/bin/bash\nfor arg in "$@"; do\n  if [ "$arg" = "aarch64linux" ] || [ "$arg" = "aarch64elf" ] || [ "$arg" = "aarch64_elf64_le_vec" ]; then\n    exec /usr/bin/aarch64-linux-gnu-ld "$@"\n  fi\ndone\nexec /usr/bin/ld.x86_64 "$@"\n' | sudo tee /usr/bin/ld > /dev/null
        sudo chmod +x /usr/bin/ld
        echo "=== Wrappers installed ==="
        head -2 /usr/bin/as
        head -2 /usr/bin/ld
        echo "=== ARM64 tools ==="
        /usr/bin/aarch64-linux-gnu-as --version | head -1
        /usr/bin/aarch64-linux-gnu-ld --version | head -1

    - name: Clone kernel source
      run: |
        git clone --depth=1 --branch 'main' \
          https://github.com/edikdruzinin-blip/android_samsung_m12_kernel kernel
        cd kernel && echo "Commit: $(git log --oneline -1)"
        echo "Available defconfigs for this device:"
        ls arch/arm64/configs/ | grep -i "m12\|exynos3830\|exynos850\|nacho\|a12\|a127" || ls arch/arm64/configs/ | head -10

    - name: Fix Mali GPU Kconfig
      run: |
        echo "" | base64 -d > kernel/drivers/gpu/arm/Kconfig

    - name: Fix Samsung build errors
      run: |
        cd kernel
        ccache --clear 2>/dev/null || true
        sed -i 's/__start_builtin_fw = \.;/. = ALIGN(8); __start_builtin_fw = .;/' include/asm-generic/vmlinux.lds.h 2>/dev/null || true
        sed -i "s/static bool __init_or_module initcall_sec_debug/static bool initcall_sec_debug/" init/main.c
        sed -i 's/panic("fail to freeze tasks: %s", secdbg_exin_get_unfz());/panic("fail to freeze tasks");/' kernel/power/process.c
        sed -i 's/if (sb->s_magic == F2FS_SUPER_MAGIC)/if (sb->s_magic == 0xF2F52010UL)/' fs/super.c
        find drivers/media/platform/exynos/camera -name "*.c" -exec sed -i 's/stpcpy(\([^,]*\),\([^)]*\))/strcpy(\\1,\\2)/g' {} \; 2>/dev/null || true
        [ -f firmware/Makefile ] && echo '# emptied by OSS build patch' > firmware/Makefile || true
        find drivers/kernelsu -name "*.c" 2>/dev/null | xargs grep -l "TWA_RESUME" 2>/dev/null | xargs sed -i 's/TWA_RESUME/TWA_NOTIFY/g' 2>/dev/null || true
        find drivers/media/platform/exynos/camera/vendor -name "Makefile" -exec sed -i '/mcd_v2/d' {} \; 2>/dev/null || true
        if [ -f drivers/media/platform/exynos/camera/vendor/mcd_v2/is-sec-define.c ]; then
          echo "/* stubbed - missing sensor headers in OSS source */" > drivers/media/platform/exynos/camera/vendor/mcd_v2/is-sec-define.c
        fi
        # Fix pdic_notifier.h vs ifconn_notifier.h enum conflict
        echo "" | base64 -d | python3

        # Remove drivers/battery/common
        echo "" | base64 -d | python3

        # Fix is-interface-sensor.c MAX()
        echo "" | base64 -d | python3

        # Fix muic_notifier.c PDIC_NOTIFY_DEV_PDIC
        echo "" | base64 -d | python3

        # Restore sm5714-muic.c
        echo "" | base64 -d | python3

        # Fix sec_param.c duplicate case
        echo "" | base64 -d | python3

        # Fix shub_iio.c missing include
        echo "" | base64 -d | python3

        # Find and patch FINGERPRINT PROTECTION FAILED in Samsung security code
        cd kernel
        echo "" | base64 -d | python3
        cd ..

        # Patch dm-verity to not panic/reboot on hash mismatch
        echo "" | base64 -d | python3

        # Fix usb_hw_param.h: comment out enum entry that conflicts with macro in usb_notify.c
        echo "" | base64 -d | python3

        # Comment out original i2c_data struct definitions to avoid redefinition with our stub
        find drivers/video/fbdev/exynos -name "*.h" -exec grep -l "struct i2c_data" {} \; | while read f; do
            sed -i '/struct i2c_data {/,/};/ s/^/\/\//' "$f"
        done

                # Fix panel i2c_data stub (with vendor/model fields)
        echo "" | base64 -d | python3

        # Fix panel i2c_data assignments
        echo "" | base64 -d | python3

        # Remove panel_drv.c from Makefile
        echo "" | base64 -d | python3

        # Fix dwc3/gadget.c, composite.c, usb_notify.c, dimming.c, sec_debug_freq
        echo "" | base64 -d | python3

        # Create samsung_oss_stubs.c via base64 (clean version, no varargs)
        echo "" | base64 -d > drivers/samsung/samsung_oss_stubs.c

        # Fix get_lcd_info and __read_overflow2 stubs
        echo "" | base64 -d | python3

        # Ensure it's added to Makefile
        if ! grep -q "samsung_oss_stubs.o" drivers/samsung/Makefile 2>/dev/null; then
            echo "obj-y += samsung_oss_stubs.o" >> drivers/samsung/Makefile
        fi

        # Fix s2mpu12-key.c
        echo "" | base64 -d | python3

        # Fix usb_notifier.c psy_do_property
        echo "" | base64 -d | python3

        echo "Samsung build fixes applied"

    - name: Apply KernelSU patch
      run: |
        echo "KernelSU disabled for vanilla boot test"
        sed -i '/kernelsu\/Kconfig/d' kernel/drivers/Kconfig || true

    - name: Configure kernel
      run: |
        cd kernel
        DEFCONF=$(ls arch/arm64/configs/ | grep -i "exynos850-m12nsxx" | head -1)
        [ -z "$DEFCONF" ] && DEFCONF=$(ls arch/arm64/configs/ | grep -i "exynos850" | head -1)
        echo "Using defconfig: $DEFCONF"
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_PATH }}/clang $DEFCONF
        scripts/config --disable CONFIG_KSU              2>/dev/null || true
        scripts/config --disable CONFIG_RANDOMIZE_BASE   2>/dev/null || true
        scripts/config --disable CONFIG_EXTRA_FIRMWARE   2>/dev/null || true
        scripts/config --disable CONFIG_IFCONN_MANAGER   2>/dev/null || true
        scripts/config --disable CONFIG_SENSORS_SSP      2>/dev/null || true
        scripts/config --disable CONFIG_SHUB             2>/dev/null || true
        scripts/config --disable CONFIG_SHUB_IIO         2>/dev/null || true
        scripts/config --enable  CONFIG_TZLOG                        2>/dev/null || true
        scripts/config --set-val CONFIG_TZLOG_PG_CNT            8    2>/dev/null || true
        scripts/config --enable  CONFIG_TZIRS                        2>/dev/null || true
        scripts/config --set-val CONFIG_TEEGRIS_VERSION         4    2>/dev/null || true
        scripts/config --enable  CONFIG_TZDEV                        2>/dev/null || true
        scripts/config --set-val CONFIG_TZDEV_IWI_EVENT         468  2>/dev/null || true
        scripts/config --set-val CONFIG_TZDEV_IWI_PANIC         469  2>/dev/null || true
        scripts/config --enable  CONFIG_TZDEV_USE_ARM_CALLING_CONVENTION 2>/dev/null || true
        scripts/config --enable  CONFIG_TZDEV_SWD_PANIC_IS_CRITICAL  2>/dev/null || true
        scripts/config --enable  CONFIG_TZDEV_SK_MULTICORE           2>/dev/null || true
        scripts/config --enable  CONFIG_TZDEV_PAGE_MIGRATION         2>/dev/null || true
        scripts/config --enable  CONFIG_TZDEV_BOOST                  2>/dev/null || true
        scripts/config --enable  CONFIG_TZDEV_KTHREADS_SMPBOOT       2>/dev/null || true
        scripts/config --enable  CONFIG_TZIC                         2>/dev/null || true
        scripts/config --enable  CONFIG_TZIC_USE_TZDEV               2>/dev/null || true
        scripts/config --disable CONFIG_SEC_DEBUG            2>/dev/null || true
        scripts/config --disable CONFIG_SEC_DEBUG_SUMMARY    2>/dev/null || true
        scripts/config --disable CONFIG_SEC_DEBUG_EXTRA_INFO 2>/dev/null || true
        scripts/config --disable CONFIG_SEC_DEBUG_AUTO_COMMENT 2>/dev/null || true
        scripts/config --disable CONFIG_SEC_DEBUG_HW_PARAM   2>/dev/null || true
        scripts/config --disable CONFIG_SEC_DEBUG_LAST_KMSG  2>/dev/null || true
        scripts/config --disable CONFIG_SEC_DEBUG_INIT_LOG   2>/dev/null || true
        scripts/config --disable CONFIG_SEC_DEBUG_FIRST2M_LOG 2>/dev/null || true
        # Disable Knox/RKP/TIMA
        scripts/config --disable CONFIG_TIMA_RKP                    2>/dev/null || true
        scripts/config --disable CONFIG_RKP_KDP                     2>/dev/null || true
        scripts/config --disable CONFIG_RKP_KDP_DEBUG               2>/dev/null || true
        scripts/config --disable CONFIG_RKP_CFP_JOPP                2>/dev/null || true
        scripts/config --disable CONFIG_RKP_CFP                     2>/dev/null || true
        scripts/config --disable CONFIG_RKP_VER                     2>/dev/null || true
        scripts/config --disable CONFIG_SLP_KDP                     2>/dev/null || true
        scripts/config --disable CONFIG_TIMA                        2>/dev/null || true
        scripts/config --disable CONFIG_TIMA_LOG                    2>/dev/null || true
        scripts/config --disable CONFIG_TIMA_ENGINE_LOG             2>/dev/null || true
        scripts/config --disable CONFIG_TIMA_LKMSG                  2>/dev/null || true
        scripts/config --disable CONFIG_KNOX_KAP
        scripts/config --disable CONFIG_PROCA               2>/dev/null || true
        scripts/config --disable CONFIG_DEFEX               2>/dev/null || true
        scripts/config --disable CONFIG_FIVE                2>/dev/null || true
        scripts/config --disable CONFIG_UH                  2>/dev/null || true
        scripts/config --disable CONFIG_UH_RKP              2>/dev/null || true
        scripts/config --disable CONFIG_KDP_CRED            2>/dev/null || true
        scripts/config --disable CONFIG_RKP_NS_PROT         2>/dev/null || true
        scripts/config --disable CONFIG_RKP_NUM_FIMC        2>/dev/null || true
        scripts/config --disable CONFIG_INTEGRITY           2>/dev/null || true                    2>/dev/null || true
        scripts/config --disable CONFIG_SECURE_OS_BOOT              2>/dev/null || true
        scripts/config --disable CONFIG_SSRM                        2>/dev/null || true
        scripts/config --disable CONFIG_SEC_FACTORY                 2>/dev/null || true
        scripts/config --disable CONFIG_SAMSUNG_PRODUCT_SHIP        2>/dev/null || true
        scripts/config --disable CONFIG_SEC_RESTRICT_SETUP          2>/dev/null || true
        scripts/config --disable CONFIG_SEC_RESTRICT_ROOTING        2>/dev/null || true
        scripts/config --disable CONFIG_SEC_RESTRICT_ROOTING_LOG    2>/dev/null || true
        # SM5714
        scripts/config --enable  CONFIG_MFD_SM5714          2>/dev/null || true
        scripts/config --disable CONFIG_CHARGER_SM5714      2>/dev/null || true
        scripts/config --disable CONFIG_FUELGAUGE_SM5714    2>/dev/null || true
        scripts/config --enable  CONFIG_LEDS_SM5714         2>/dev/null || true
        scripts/config --disable CONFIG_MUIC_SM5714         2>/dev/null || true
        scripts/config --enable  CONFIG_MUIC_NOTIFIER       2>/dev/null || true
        scripts/config --enable  CONFIG_USE_MUIC            2>/dev/null || true
        scripts/config --enable  CONFIG_VBUS_NOTIFIER       2>/dev/null || true
        scripts/config --enable  CONFIG_PDIC_SM5714         2>/dev/null || true
        scripts/config --disable CONFIG_PDIC_NOTIFIER                2>/dev/null || true
        scripts/config --disable CONFIG_USB_TYPEC_MANAGER_NOTIFIER   2>/dev/null || true
        scripts/config --disable CONFIG_PDIC_SM5714                  2>/dev/null || true
        scripts/config --enable  CONFIG_USB_TYPEC_MANAGER_NOTIFIER 2>/dev/null || true
        scripts/config --disable CONFIG_BATTERY_SAMSUNG     2>/dev/null || true
        scripts/config --enable  CONFIG_ANDROID_BINDERFS   2>/dev/null || true
        scripts/config --enable  CONFIG_F2FS_FS_COMPRESSION 2>/dev/null || true
        scripts/config --enable  CONFIG_F2FS_FS_LZO         2>/dev/null || true
        scripts/config --enable  CONFIG_F2FS_FS_LZ4         2>/dev/null || true
        scripts/config --enable  CONFIG_ZSMALLOC            2>/dev/null || true
        scripts/config --enable  CONFIG_ZRAM                2>/dev/null || true
        scripts/config --enable  CONFIG_ZRAM_WRITEBACK      2>/dev/null || true
        scripts/config --enable  CONFIG_LZO_COMPRESS        2>/dev/null || true
        scripts/config --enable  CONFIG_LZ4_COMPRESS        2>/dev/null || true
        scripts/config --enable  CONFIG_CRYPTO_LZO          2>/dev/null || true
        scripts/config --enable  CONFIG_PANIC_ON_OOPS       2>/dev/null || true
        scripts/config --enable  CONFIG_EXYNOS_DECON_LCD              2>/dev/null || true
        scripts/config --enable  CONFIG_EXYNOS_DECON_LCD_SYSFS        2>/dev/null || true
        scripts/config --enable  CONFIG_EXYNOS_DECON_LCD_ILI9882N_M12S 2>/dev/null || true
        scripts/config --enable  CONFIG_EXYNOS_DECON_LCD_NT36675_M12  2>/dev/null || true
        scripts/config --enable  CONFIG_EXYNOS_DECON_LCD_ILI7806S_M12 2>/dev/null || true
        scripts/config --enable  CONFIG_PANEL_AID_DIMMING             2>/dev/null || true
        scripts/config --enable  CONFIG_SENSORS_FINGERPRINT           2>/dev/null || true
        scripts/config --enable  CONFIG_FINGERPRINT_SECURE            2>/dev/null || true
        scripts/config --enable  CONFIG_SENSORS_FINGERPRINT_LSI       2>/dev/null || true
        scripts/config --enable  CONFIG_SENSORS_GW3X                  2>/dev/null || true
        scripts/config --enable  CONFIG_IS_DDK_DATA_LOAD              2>/dev/null || true
        scripts/config --enable  CONFIG_CAMERA_MMT_V12                2>/dev/null || true
        scripts/config --enable  CONFIG_CAMERA_CIS_SR846_OBJ          2>/dev/null || true
        scripts/config --enable  CONFIG_CAMERA_CIS_GC5035_OBJ         2>/dev/null || true
        scripts/config --enable  CONFIG_CAMERA_CIS_GM2_OBJ            2>/dev/null || true
        scripts/config --enable  CONFIG_CAMERA_CIS_GC02M1_OBJ         2>/dev/null || true
        scripts/config --enable  CONFIG_CAMERA_ACT_FP5529_OBJ         2>/dev/null || true
        scripts/config --enable  CONFIG_CAMERA_FLASH_SM5714_OBJ       2>/dev/null || true
        scripts/config --enable  CONFIG_SND_SOC_SAMSUNG_EXYNOS3830_AUD3004X 2>/dev/null || true
        scripts/config --enable  CONFIG_SND_SOC_SAMSUNG_AUDIO              2>/dev/null || true
        scripts/config --enable  CONFIG_SND_SOC_SAMSUNG_SYSFS_EARJACK      2>/dev/null || true
        scripts/config --enable  CONFIG_SND_SOC_AUD3004X                   2>/dev/null || true
        scripts/config --enable  CONFIG_SND_SOC_AUD3004X_5PIN              2>/dev/null || true
        scripts/config --enable  CONFIG_SND_SMARTPA_AW8896                 2>/dev/null || true
        scripts/config --enable  CONFIG_LEDS_SM5714                        2>/dev/null || true
        scripts/config --enable  CONFIG_CAMERA_FLASH_SM5714_OBJ            2>/dev/null || true
        scripts/config --enable  CONFIG_DC_VIBRATOR                        2>/dev/null || true
        scripts/config --enable  CONFIG_SEC_VIBRATOR                       2>/dev/null || true
        scripts/config --enable  CONFIG_SEC_NFC                            2>/dev/null || true
        scripts/config --enable  CONFIG_SEC_NFC_LOGGER                     2>/dev/null || true
        scripts/config --enable  CONFIG_SENSORS_A96T3X6                    2>/dev/null || true
        scripts/config --enable  CONFIG_SENSORS_A96T3X6_SUB                2>/dev/null || true
        scripts/config --enable  CONFIG_SENSORS_SEC_THERMISTOR             2>/dev/null || true
        scripts/config --enable  CONFIG_SEC_ABC                            2>/dev/null || true
        scripts/config --enable  CONFIG_SEC_ABC_COMMON                     2>/dev/null || true
        scripts/config --enable  CONFIG_SEC_ABC_HUB                        2>/dev/null || true
        scripts/config --enable  CONFIG_SEC_ABC_HUB_CORE                   2>/dev/null || true
        scripts/config --enable  CONFIG_SEC_ABC_HUB_BOOTC                  2>/dev/null || true
        scripts/config --enable  CONFIG_ARM64_VA_BITS_39 2>/dev/null || true
        scripts/config --disable CONFIG_ARM64_VA_BITS_48 2>/dev/null || true
        scripts/config --enable  CONFIG_DM_BOW           2>/dev/null || true
        scripts/config --enable  CONFIG_DM_VERITY        2>/dev/null || true
        scripts/config --enable  CONFIG_DM_VERITY_FEC    2>/dev/null || true
        scripts/config --disable CONFIG_DM_VERITY_AVB    2>/dev/null || true
        scripts/config --enable  CONFIG_DM_SNAPSHOT      2>/dev/null || true
        scripts/config --enable  CONFIG_PSTORE           2>/dev/null || true
        scripts/config --enable  CONFIG_PSTORE_RAM       2>/dev/null || true
        scripts/config --enable  CONFIG_PSTORE_CONSOLE   2>/dev/null || true
        scripts/config --set-str CONFIG_CMDLINE "androidboot.warranty_bit=0 androidboot.bootlock=0 androidboot.veritymode=disabled androidboot.verifiedbootstate=orange androidboot.selinux=permissive enforcing=0 androidboot.secureboot=0 androidboot.force_secureboot=0 dm_verity.dev_wait=0" 2>/dev/null || true
        scripts/config --enable  CONFIG_CMDLINE_EXTEND   2>/dev/null || true
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=${{ env.CLANG_PATH }}/clang CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=0 AS=aarch64-linux-gnu-as LD=aarch64-linux-gnu-ld olddefconfig
        # Patch DTS: ensure veritymode=disabled is in device tree bootargs
        find arch/arm64/boot/dts -name "*.dts" -o -name "*.dtsi" 2>/dev/null | xargs grep -l "veritymode" 2>/dev/null | while read f; do
            sed -i 's/veritymode=enforcing/veritymode=disabled/g' "$f"
            echo "Patched DTS: $f"
        done || true
        grep -E "^CONFIG_(ARM64_VA_BITS|DM_BOW|BLK_DEV_DM|SELINUX)=" .config

    - name: Build kernel
      run: |
        cd kernel
        make -k ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache ${{ env.CLANG_PATH }}/clang" CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=0 AS=aarch64-linux-gnu-as LD=aarch64-linux-gnu-ld KCFLAGS="-w -Wno-error -U_FORTIFY_SOURCE" KBUILD_LDFLAGS="--allow-multiple-definition" -j$(nproc) Image 2>&1 | tee /tmp/full_build.log
        BUILD_RESULT_IMG=${PIPESTATUS[0]}
        make -k ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache ${{ env.CLANG_PATH }}/clang" CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=0 AS=aarch64-linux-gnu-as LD=aarch64-linux-gnu-ld KCFLAGS="-w -Wno-error -U_FORTIFY_SOURCE" KBUILD_LDFLAGS="--allow-multiple-definition" -j$(nproc) -k modules 2>&1 | tee -a /tmp/full_build.log || true
        make -k ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache ${{ env.CLANG_PATH }}/clang" CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=0 AS=aarch64-linux-gnu-as LD=aarch64-linux-gnu-ld modules_install INSTALL_MOD_PATH=../modules_staging INSTALL_MOD_STRIP=1 2>&1 || true
        KVER=$(ls ../modules_staging/lib/modules/ 2>/dev/null | head -1)
        if [ -n "$KVER" ]; then
            echo "Running depmod for kernel version: $KVER"
            depmod -b ../modules_staging "$KVER" 2>/dev/null || depmod -ae -F System.map -b ../modules_staging "$KVER" 2>/dev/null || echo "depmod skipped (non-fatal)"
        fi
        find ../modules_staging -type l -delete
        echo "=== Collected modules ==="
        find ../modules_staging -name "*.ko" | wc -l
        find ../modules_staging -name "*.ko" | head -20
        echo "=== modules.dep entries ==="
        wc -l ../modules_staging/lib/modules/*/modules.dep 2>/dev/null || echo "no modules.dep generated"
        BUILD_RESULT=$BUILD_RESULT_IMG
        echo "=== LINKER ERRORS ==="
        grep -E "undefined reference|relocation|cannot find -l" /tmp/full_build.log | head -60 || echo "No linker errors"
        echo "=== END LINKER ERRORS ==="
        echo "=== COMPILER ERRORS ==="
        grep -E "error:" /tmp/full_build.log | grep -v "^Binary" | head -60 || echo "No compiler errors"
        echo "=== END COMPILER ERRORS ==="
        echo "=== FIRST 40 ERRORS IN LOG ==="
        grep -n "error:\|Error \|unrecognized option" /tmp/full_build.log | grep -v "objdump\|^Binary" | head -40 || true
        echo "=== END FIRST ERRORS ==="
        echo "=== LAST 100 LINES ==="
        tail -100 /tmp/full_build.log
        echo "=== END LAST 100 LINES ==="
        if [ $BUILD_RESULT -ne 0 ]; then
            exit $BUILD_RESULT
        fi
        echo "=== ccache stats ==="
        ccache --show-stats

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/full_build.log
        retention-days: 7

    - name: Clone AnyKernel3
      run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel

    - name: Download physwizz v5 and extract ramdisk
      run: |
        echo "Downloading physwizz v5-clean ZIP..."
        curl -L --max-time 60 "https://github.com/physwizz/M127F-T-u3/releases/download/v5-clean/physwizz_m127f-u3-kernel-v5-clean.zip" -o physwizz.zip || \
        curl -L --max-time 60 "https://github.com/physwizz/M127F-T-u3/releases/latest/download/physwizz_m127f-u3-kernel-v5-clean.zip" -o physwizz.zip
        if [ ! -f physwizz.zip ] || [ ! -s physwizz.zip ]; then
          echo "FATAL: could not download physwizz v5 zip"
          exit 1
        fi
        echo "=== physwizz.zip contents ==="
        unzip -l physwizz.zip | head -30
        mkdir -p physwizz_tools
        unzip -j physwizz.zip "tools/init_spectrum.rc" "tools/init.spectrum.sh" "tools/init.zram.rc" "tools/30zram" -d physwizz_tools/ 2>/dev/null || true
        cp physwizz_tools/* anykernel/tools/ 2>/dev/null && echo "Physwizz tools copied OK" || true
        mkdir -p physwizz_extracted
        unzip -o physwizz.zip -d physwizz_extracted/ 2>/dev/null || true
        ls -la physwizz_extracted/
        if [ -f physwizz_extracted/boot.img ]; then
          echo "Found boot.img in physwizz zip - extracting ramdisk"
          cd physwizz_extracted
          ../anykernel/tools/magiskboot unpack boot.img
          ls -la
          if [ -d ramdisk ] || [ -f ramdisk.cpio* ]; then
            echo "Ramdisk extracted successfully"
            cp -r ramdisk ../anykernel/ramdisk_physwizz/ 2>/dev/null || true
            cp ramdisk.cpio* ../anykernel/ 2>/dev/null || true
          fi
          cd ..
        else
          echo "No boot.img found in physwizz zip - will use device ramdisk (dump_boot)"
          echo "ZIP contains:"
          ls physwizz_extracted/
        fi

    - name: Package kernel
      run: |
        cp kernel/arch/arm64/boot/Image anykernel/
        # Embed pre-patched vbmeta files (flags=0x3: disable_verity + disable_verification)
        # vbmeta.img  = from physwizz zip (9744 bytes)
        # vbmeta1.img = from device after physwizz install (524288 bytes)
        # Both already have flags=0x3 set by physwizz
        echo "" | base64 -d > anykernel/vbmeta.img
        echo "vbmeta.img embedded ($(wc -c < anykernel/vbmeta.img) bytes)"
        # Patch vbmeta1 flags in-place (set disable_verity|disable_verification = 0x00000003)
        # flags field is at offset 120 in AVB header
        printf '\x00\x00\x00\x03' | dd of=/dev/block/platform/12100000.dwmmc0/by-name/vbmeta1 bs=1 seek=120 conv=notrunc 2>/dev/null || true
        echo "vbmeta1 flags patched in-place"
        echo "vbmeta1.img embedded ($(wc -c < anykernel/vbmeta1.img) bytes)"
        MODS_DEST=anykernel/modules/vendor/lib/modules
        mkdir -p "$MODS_DEST"
        if [ -d modules_staging ]; then
            find modules_staging -name "*.ko" -exec cp {} "$MODS_DEST/" \;
            KVER=$(ls modules_staging/lib/modules/ 2>/dev/null | head -1)
            if [ -n "$KVER" ]; then
                for f in modules.dep modules.alias modules.softdep modules.load modules.order; do
                    src="modules_staging/lib/modules/$KVER/$f"
                    [ -f "$src" ] && cp "$src" "$MODS_DEST/" && echo "Copied $f"
                done
            fi
            MOD_COUNT=$(find "$MODS_DEST" -name "*.ko" | wc -l)
            echo "=== Packaged $MOD_COUNT kernel modules ==="
            ls "$MODS_DEST"
        else
            echo "No modules_staging directory found, skipping modules"
        fi
        echo "" | base64 -d > anykernel/anykernel.sh
        cd anykernel && zip -r9 ../SM-M127F_Vanilla.zip . -x "*.git*" "*.github*" "*.md"
        ls -lh ../SM-M127F_Vanilla.zip
        echo "=== ZIP contents (modules) ==="
        unzip -l ../SM-M127F_Vanilla.zip | grep "\.ko" | wc -l | xargs echo "Total .ko files in zip:"

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SM-M127F_Vanilla
        path: SM-M127F_Vanilla.zip
        retention-days: 7
